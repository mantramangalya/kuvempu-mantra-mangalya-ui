<body data-page="contact" data-root="../">
<div id="app-header"></div>
<main id="main">
  <section class="page-hero"><span class="float f1"></span><span class="float f2"></span><div class="wrap"><div class="ic"><i class="bi bi-envelope-heart"></i></div><h1 data-i18n="nav.contact"></h1><p data-i18n="ph.contact"></p></div></section>

  <section class="block"><div class="wrap">
    <div class="social-grid">
      <a class="social reveal" href="mailto:mantramangalya1966@gmail.com"><span class="ic mail"><i class="bi bi-envelope-fill"></i></span><span><small data-i18n="contact.email"></small><b>mantramangalya1966@gmail.com</b></span></a>
      <a class="social reveal" href="https://www.instagram.com/mantramangalya.maduve" target="_blank" rel="noopener"><span class="ic insta"><i class="bi bi-instagram"></i></span><span><small data-i18n="contact.instagram"></small><b>mantramangalya.maduve</b></span></a>
      <a class="social reveal" href="https://www.facebook.com/mantramangalya.maduve" target="_blank" rel="noopener"><span class="ic fb"><i class="bi bi-facebook"></i></span><span><small data-i18n="contact.facebook"></small><b>mantramangalya.maduve</b></span></a>
    </div>
  </div></section>

  <section class="block" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><h2 data-i18n="form.title"></h2></div>
    <form class="form-card reveal" id="queryForm" novalidate>
      <div class="alert ok" id="alertOk" role="status"><i class="bi bi-check-circle-fill"></i><span></span></div>
      <div class="alert bad" id="alertBad" role="alert"><i class="bi bi-exclamation-triangle-fill"></i><span></span></div>

      <div class="f-row">
      <div class="field"><label for="f-name"><span data-i18n="form.name"></span> <span class="req">*</span></label>
        <input id="f-name" name="Name" type="text" maxlength="60" autocomplete="name" data-i18n-placeholder="form.ph.name" required>
        <div class="err" role="alert"></div></div>
      <div class="field"><label for="f-phone"><span data-i18n="form.phone"></span> <span class="req">*</span></label>
        <input id="f-phone" name="Contact Number" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" data-i18n-placeholder="form.ph.phone" required>
        <div class="err" role="alert"></div></div>
      </div>

      <div class="f-row">
      <div class="field"><label for="f-email"><span data-i18n="form.email"></span> <span class="req">*</span></label>
        <input id="f-email" name="Email" type="email" autocomplete="email" data-i18n-placeholder="form.ph.email" required>
        <div class="err" role="alert"></div></div>
      <div class="field"><label for="f-place"><span data-i18n="form.place"></span> <span class="req">*</span></label>
        <input id="f-place" name="Place" type="text" autocomplete="address-level2" data-i18n-placeholder="form.ph.place" required>
        <div class="hint" id="cnt-place">0/200</div><div class="err" role="alert"></div></div>
      </div>

      <div class="field"><label for="f-topic"><span data-i18n="form.topic"></span> <span class="req">*</span></label>
        <select id="f-topic" name="Topic" required></select>
        <div class="err" role="alert"></div></div>

      <div class="field"><label for="f-message"><span data-i18n="form.message"></span> <span class="req">*</span></label>
        <textarea id="f-message" name="Message" data-i18n-placeholder="form.ph.message" required></textarea>
        <div class="err" role="alert"></div></div>

      <div class="consent"><i class="bi bi-shield-lock-fill"></i><p data-i18n="form.consent"></p></div>

      <input class="hp" id="f-website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-primary" id="submitBtn" type="submit" style="width:100%"><i class="bi bi-send-fill"></i><span data-i18n="form.submit"></span></button>
    </form>
  </div></section>
