<body data-page="home">
<div id="app-header"></div>
<main id="main">
  <section class="hero" id="heroSlider" aria-roledescription="carousel">
    <span class="float f1"></span><span class="float f2"></span><span class="float f3"></span>
    <div class="slides">
      <div class="slide"><div class="wrap">
        <span class="badge"><i class="bi bi-stars"></i><span data-i18n="hero.s1.badge"></span></span>
        <h1 data-i18n="hero.s1.title"></h1><p data-i18n="hero.s1.text"></p>
        <div class="ctas"><a class="btn btn-primary" href="#about"><i class="bi bi-book"></i><span data-i18n="hero.cta1"></span></a><a class="btn btn-ghost" href="contact/"><i class="bi bi-envelope"></i><span data-i18n="hero.cta2"></span></a></div>
      </div></div>
      <div class="slide"><div class="wrap">
        <span class="badge"><i class="bi bi-calendar-heart"></i><span data-i18n="hero.s2.badge"></span></span>
        <h2 data-i18n="hero.s2.title"></h2><p data-i18n="hero.s2.text"></p>
        <div class="ctas"><a class="btn btn-primary" href="about/#first"><i class="bi bi-heart-fill"></i><span data-i18n="hero.cta1"></span></a></div>
      </div></div>
      <div class="slide"><div class="wrap">
        <span class="badge"><i class="bi bi-quote"></i><span data-i18n="hero.s3.badge"></span></span>
        <h2 data-i18n="hero.s3.title"></h2><p data-i18n="hero.s3.text"></p>
        <div class="ctas"><a class="btn btn-primary" href="about/"><i class="bi bi-arrow-right-circle"></i><span data-i18n="hero.cta1"></span></a></div>
      </div></div>
    </div>
    <button class="s-arrow s-prev" data-i18n-aria="slider.prev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
    <button class="s-arrow s-next" data-i18n-aria="slider.next" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
    <div class="dots"></div>
  </section>


  <section class="block" id="about"><div class="wrap">
    <div class="sec-head"><h2 data-i18n="home.about.title"></h2><p data-i18n="home.about.sub"></p></div>
    <div class="acc-tools">
      <button class="btn btn-light" id="expandAll"><i class="bi bi-arrows-expand"></i><span data-i18n="btn.expand"></span></button>
      <a class="btn btn-light" href="about/"><i class="bi bi-box-arrow-up-right"></i><span data-i18n="btn.readfull"></span></a>
    </div>
    <div id="aboutBox" data-mode="accordion"></div>
  </div></section>

  <section class="block" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><h2 data-i18n="home.explore.title"></h2><p data-i18n="home.explore.sub"></p></div>
    <div class="cards c3">
      <a class="card reveal" href="guidance/"><div class="ic"><i class="bi bi-compass"></i></div><h3 data-i18n="nav.guidance"></h3><p data-i18n="card.guidance"></p><span class="more"><span data-i18n="card.open"></span> <i class="bi bi-arrow-right"></i></span></a>
      <a class="card reveal" href="downloads/"><div class="ic"><i class="bi bi-download"></i></div><h3 data-i18n="nav.downloads"></h3><p data-i18n="card.downloads"></p><span class="more"><span data-i18n="card.open"></span> <i class="bi bi-arrow-right"></i></span></a>
      <a class="card reveal" href="community/"><div class="ic"><i class="bi bi-people"></i></div><h3 data-i18n="nav.community"></h3><p data-i18n="card.community"></p><span class="more"><span data-i18n="card.open"></span> <i class="bi bi-arrow-right"></i></span></a>
    </div>
  </div></section>

  <section class="block" id="comments" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><h2 data-i18n="cm.title"></h2></div>
    <div id="cmList"></div>
    <h3 class="cm-reply" id="cmReply"><i class="bi bi-reply-fill"></i><span data-i18n="cm.reply"></span></h3>
    <form class="form-card" id="cmForm" novalidate>
      <div class="alert ok" id="cmOk" role="status"><i class="bi bi-check-circle-fill"></i><span></span></div>
      <div class="alert bad" id="cmBad" role="alert"><i class="bi bi-exclamation-triangle-fill"></i><span></span></div>
      <div class="field" data-k="name"><label for="cm-name"><span data-i18n="cm.name"></span> <span class="req">*</span></label>
        <input id="cm-name" type="text" maxlength="30" autocomplete="name"><div class="err" role="alert"></div></div>
      <div class="field" data-k="text"><label for="cm-text"><span data-i18n="cm.comment"></span> <span class="req">*</span></label>
        <textarea id="cm-text" maxlength="500" data-i18n-placeholder="cm.ph"></textarea><div class="hint" id="cm-cnt">0/500</div><div class="err" role="alert"></div></div>
      <input class="hp" id="cm-website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-primary" id="cmSubmit" type="submit" style="width:100%"><i class="bi bi-send-fill"></i><span data-i18n="cm.submit"></span></button>
    </form>
  </div></section>

  <section class="block" style="padding-top:0"><div class="wrap"><div class="cta-pair">
    <div class="cta-band reveal">
      <h2 data-i18n="cta.title"></h2><p data-i18n="cta.text"></p>
      <a class="btn btn-light" href="contact/"><i class="bi bi-envelope-heart"></i><span data-i18n="nav.contact"></span></a>
    </div>
    <div class="cta-band reveal">
      <h2 data-i18n="com.join.title"></h2><p data-i18n="com.join.text"></p>
      <button type="button" class="btn btn-light" id="joinBtn"><i class="bi bi-people-fill"></i><span data-i18n="com.join.btn"></span></button>
    </div>
  </div></div></section>
