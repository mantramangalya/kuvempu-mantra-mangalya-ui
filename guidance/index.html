<html lang="kn">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ಮಾರ್ಗದರ್ಶನ | ಕುವೆಂಪು ಮಂತ್ರ ಮಾಂಗಲ್ಯ</title>
<meta name="theme-color" content="#7a1f2b">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;700&family=Noto+Serif+Kannada:wght@600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="guidance" data-root="../">
<div id="app-header"></div>
<main id="main">
  <section class="page-hero"><span class="float f1"></span><span class="float f2"></span><div class="wrap"><div class="ic"><i class="bi bi-compass"></i></div><h1 data-i18n="nav.guidance"></h1><p data-i18n="ph.guidance"></p></div></section>
  <section class="block"><div class="wrap">
    <div class="g-layout">
      <div class="g-main">
        <div class="tabs" id="gTabs" role="tablist">
          <button class="tab" id="tabbtn-guidance" data-tab="guidance" role="tab" aria-controls="tab-guidance"><i class="bi bi-compass"></i><span data-i18n="g.tab.guidance"></span></button>
          <button class="tab" id="tabbtn-gallery" data-tab="gallery" role="tab" aria-controls="tab-gallery"><i class="bi bi-images"></i><span data-i18n="g.tab.gallery"></span></button>
          <button class="tab" id="tabbtn-plan" data-tab="plan" role="tab" aria-controls="tab-plan"><i class="bi bi-clipboard2-check"></i><span data-i18n="g.tab.plan"></span></button>
          <button class="tab" id="tabbtn-code" data-tab="code" role="tab" aria-controls="tab-code"><i class="bi bi-journal-text"></i><span data-i18n="g.tab.code"></span></button>
          <button class="tab" id="tabbtn-faq" data-tab="faq" role="tab" aria-controls="tab-faq"><i class="bi bi-patch-question"></i><span data-i18n="g.tab.faq"></span></button>
        </div>
        <div class="panes">
          <section class="pane" id="tab-guidance" role="tabpanel" aria-labelledby="tabbtn-guidance" hidden></section>
          <section class="pane" id="tab-gallery" role="tabpanel" aria-labelledby="tabbtn-gallery" hidden></section>
          <section class="pane" id="tab-plan" role="tabpanel" aria-labelledby="tabbtn-plan" hidden></section>
          <section class="pane" id="tab-code" role="tabpanel" aria-labelledby="tabbtn-code" hidden></section>
          <section class="pane" id="tab-faq" role="tabpanel" aria-labelledby="tabbtn-faq" hidden></section>
        </div>
      </div>
    </div>
  </div></section>

  <section class="block" id="comments" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><h2 data-i18n="cm.title"></h2></div>
    <div id="cmList"></div>
    <h3 class="cm-reply" id="cmReply"><i class="bi bi-reply-fill"></i><span data-i18n="cm.reply"></span></h3>
    <form class="form-card" id="cmForm" novalidate>
      <div class="alert ok" id="cmOk" role="status"><i class="bi bi-check-circle-fill"></i><span></span></div>
      <div class="alert bad" id="cmBad" role="alert"><i class="bi bi-exclamation-triangle-fill"></i><span></span></div>
      <div class="field" data-k="name"><label for="cm-name"><span data-i18n="cm.name"></span> <span class="req">*</span></label>
        <input id="cm-name" type="text" maxlength="30" autocomplete="name"><div class="err" role="alert"></div></div>
      <div class="field" data-k="text"><label for="cm-text"><span data-i18n="cm.comment"></span> <span class="req">*</span></label>
        <textarea id="cm-text" maxlength="500" data-i18n-placeholder="cm.ph"></textarea><div class="hint" id="cm-cnt">0/500</div><div class="err" role="alert"></div></div>
      <input class="hp" id="cm-website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-primary" id="cmSubmit" type="submit" style="width:100%"><i class="bi bi-send-fill"></i><span data-i18n="cm.submit"></span></button>
    </form>
  </div></section>

  <section class="block" id="needHelp" style="padding-top:0"><div class="wrap"><div class="ask-end">
        <div class="ask-card">
          <div class="ask-ic"><i class="bi bi-chat-heart-fill"></i></div>
          <h3 data-i18n="g.ask.title"></h3>
          <p data-i18n="g.ask.text"></p>
          <a class="btn btn-primary" href="../contact/"><i class="bi bi-envelope-heart"></i><span data-i18n="guid.ask.btn"></span></a>
        </div>
  </div></div></section>
</main>
<div id="app-footer"></div>
<script src="../js/config.js"></script>
<script src="../data/manifest.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/guide-content.js"></script>
<script src="../js/docgen.js"></script>
<script src="../js/app.js"></script>
<script src="../js/callback.js"></script>
<script src="../js/community.js"></script>
<script src="../js/browse.js"></script>
<script src="../js/guidance.js"></script>
<script src="../js/comments.js"></script>
</body>
</html>
